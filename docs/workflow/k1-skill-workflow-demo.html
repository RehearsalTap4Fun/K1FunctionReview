<script>const steps=[{"id": "all", "title": "完整动作流", "box": [0, 0, 1840, 3770], "notes": ["当前有三个入口：静态预检、直接运行验收、独立准备环境；版本进包表验收是在运行主线上叠加需求级进度。", "运行验收先走 P：查找反馈表、处理缺链接分支、补齐字段；再走 B 主线及 B6 逐项维护。静态预检走 A，其中 A3 明确生成或更新测试用例。", "可先选择下一个步骤，逐段放大。键盘左右箭头切换；总览可保存为单个 SVG。"]}, {"id": "overview", "title": "01 · 接收与恢复", "box": [24, 20, 1792, 300], "notes": ["读取用户的任务类型、已有交接、功能经验和授权范围。依赖按场景检查，凭证留在私有配置。", "版本任务必须完整读完该版本日需求清单；稳定需求 ID 是计数单位，各协作者共用一个台账。", "已确认的决定直接沿用，事实先查；不能把不确定的部署分配当作已授权。"]}, {"id": "feedback", "title": "02 · 反馈表准备与缺链接分支", "box": [24, 320, 1792, 585], "notes": ["两类运行验收先查提供链接、任务关联和私有经验。找到唯一适用表且已授权时直接复用；不可读或只读应补权限，不等于无表。", "确实找不到时问一个选择：补充已有链接，还是新建反馈表（推荐）。已有创建决定和目录直接执行；缺必要位置时再问，未回答不当作同意。", "准备八类信息：稳定反馈 ID、关联需求/用例、问题描述、问题截图、唯一验收状态、验收详情、环境/版本、最近验收时间。平台原生稳定记录 ID 可复用。", "同义字段直接映射；缺什么字段就在原表补建什么，不重建整张表。保留旧数据、图片、开发状态和下拉；新验收字段用待验收/验收中/未通过/已通过。", "建表/补列由 Agent 使用可用文档工具完成，回读后再做反馈快照；现有反馈 CLI 不会自动建表。待准备期间独立验收继续，待同步截图保留。"]}, {"id": "static", "title": "03 · 首次静态预检", "box": [24, 915, 556, 1124], "notes": ["从原文与三端冻结版本出发，双向检查文档需求和最终实现，不能只看 diff。", "A2 完成文档确认与回读后，A3 生成或更新测试用例：前置、操作、预期和需求关联。已有用例校准并补覆盖；缺覆盖时按 Skill 调用 slg-testcase-generator。A5 发布 testcases.md。", "静态检查覆盖调用链、协议、服务端与正式 Excel 配置，验证证据定位及合同一致性。", "发布预检并记录文档确认标记；预检不代表运行验收通过。只有用户请求实测时才转入 B。"]}, {"id": "runtime", "title": "04 · 运行验收主线", "box": [580, 915, 690, 1124], "notes": ["接续任务先核对预检后的文档确认标记；同版本直接沿用，变化只重对齐相关规则。", "开发分支按文档与反馈表详细验收；主分支按正常玩家路径体验，明确指定的反馈才做定向复验。", "两类模式都先确认每设备独占实例；有 UI 改动都要英、俄、阿三语，不因主分支回归跳过。", "先分析顺序影响、合并共享准备，再安排隔离资源下的并行批次。业务成功依赖和执行顺序要分开。", "next 只派发当前可执行动作；Agent 必须真正操作、采集最终状态并回填证据。", "B4 是对本轮范围编排顺序、依赖与协作，不等同于重新生成全量开发用例。B5 每项实际执行后都接 B6 反馈维护，不能等整轮结束才整理问题。"]}, {"id": "support", "title": "05 · 条件动作与隔离", "box": [1270, 915, 542, 1124], "notes": ["独占测试服可复用，不必每轮重建。不同账号、名称或容器不能单独证明时钟和存储隔离。", "缺环境才进入 prepare / advance：备份、匹配本次回执、内存使用 DownKey、部署并验证实际运行。单独建环境不用先做静态对齐。", "同服仅作为用户指定例外；服务器级 GM 由协调者安排，所有受影响台账都需核对，不能只看本机 check-advance。", "UI 检查限定受影响界面：英看排版、俄看长文案、阿看 RTL 与混排。详细验收另选代表屏幕端点，主分支不自动扩大全尺寸矩阵。", "C5 是主线 B6 的写入细则：反馈图追加到原格，保留原图、下拉与开发状态；上传成功不等于在线附件已验证。"]}, {"id": "feedback_write", "title": "06 · 逐项维护反馈文档", "box": [24, 2015, 1792, 205], "notes": ["B5 实际执行 → B6 更新已有反馈或新增真实问题 → 回读文字及所有图片 → 保存需求结论 → E1 播报。每项及时维护，不等整轮结束。", "新问题记录复现前置、步骤、预期与实际结果、环境/版本、真实时间及证据。已有反馈先看原图；本次图片追加到原截图单元格。", "只有一个验收字段，必要说明放验收详情。开发处理状态与验收结论独立，原图、下拉和非目标内容保留。", "没有新增问题的正常项维护需求报告和台账，不制造问题行。缺表、字段未就绪、上传失败均记录待同步；本地保存不等于在线维护完成。", "未完成相关反馈维护不能给整项完整通过；业务断言结果如实保留。附件验证并解除依赖后才清理临时文件，机器证据与待补验材料继续保留。"]}, {"id": "loop", "title": "07 · 自动补验循环", "box": [24, 2225, 1792, 435], "notes": ["pending / partial 仍需继续；waiting 处理真实业务依赖，暂缓批次不等于已完成。", "已授权范围内先利用现有条件，再评估 GM / 模拟及独立环境；存在可行方案就继续。", "失败项不阻断其他独立项。真实阻塞须记录尝试、剩余方案和补验条件。", "无可继续动作才能进入整轮收尾；结束本轮与完整通过是两个结论。", "每条原始需求形成终态时即可进入播报，不要等整轮结束。三语断言不会把需求数量乘三。"]}, {"id": "closure", "title": "08 · 结果、播报与清理", "box": [24, 2660, 1792, 410], "notes": ["每项：完成本轮必要反馈写回与回读，再 record 保存需求结论并通知。相关维护可继续时保持 running；真实受阻记 blocked，确定缺陷记 failed 并披露同步缺口；未闭环不能播报通过。正常无问题项不虚构反馈行。", "整轮：确认可继续项为零、计划不漂移、证据和收尾有效，再 publish。主分支回归结论只代表本轮玩家范围。", "结果文档和附件已核验后，可以处理该项临时文件，不必等待所有需求通过。", "可迁移的人工引用先迁移；机器台账仍按路径或哈希依赖的原始证据必须保留。当前脚本不支持 URL 直接替代本地证据。", "保留正式台账、用户原件、可复用脚本和待补验材料，只按清单删除本轮无依赖过程文件。"]}, {"id": "continuity", "title": "09 · 进度与续跑", "box": [24, 3060, 1792, 320], "notes": ["版本总数等于已完成、待验收、正在验收和未完成之和；不输出完成百分比，不用子用例数代替需求数。", "重复同一结论保持安静；复验后结论变化才再次播报。发送失败不改变业务结果。", "发送结果 unknown 时先核对群消息和回执，不能盲目重发。当前机器人链路没有自动查询群消息的能力。", "经验在开始、阶段结束、交接和中断时维护；方法可以复用，历史结论不能替代本轮证据。"]}, {"id": "roles", "title": "10 · 执行分工与确认点", "box": [24, 3365, 1792, 300], "notes": ["Agent 负责理解规则、实际执行和读图；脚本负责可校验合同、持久记录与有限的外部动作。", "证据文件存在、构建成功或脚本校验通过，都不直接证明功能正确。", "用户负责需求调整、缺失的目标分配、同服例外、排除验收项等无法从环境事实推导的决定。", "有效授权持续生效；只暂停依赖缺失信息的动作，其他独立工作继续。"]}];let current=0,scale=1;const svg=document.querySelector('svg'),canvas=document.querySelector('#canvas'),stage=document.querySelector('#stage');const tabs=document.querySelector('#tabs');steps.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.title;b.onclick=()=>show(i);tabs.append(b)});function zoom(){canvas.style.width=(scale*100)+'%';document.querySelector('#zoom').textContent=Math.round(scale*100)+'%'}function show(i){current=(i+steps.length)%steps.length;const s=steps[current];svg.setAttribute('viewBox',s.box.join(' '));svg.setAttribute('width',s.box[2]);svg.setAttribute('height',s.box[3]);document.querySelector('#step-title').textContent=s.title;const n=document.querySelector('#notes');n.replaceChildren();s.notes.forEach(t=>{const li=document.createElement('li');li.textContent=t;n.append(li)});[...tabs.children].forEach((b,j)=>b.classList.toggle('active',j===current));scale=1;zoom();stage.scrollTo(0,0)}document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);document.querySelector('#plus').onclick=()=>{scale=Math.min(3,scale+.2);zoom()};document.querySelector('#minus').onclick=()=>{scale=Math.max(.5,scale-.2);zoom()};document.querySelector('#fit').onclick=()=>{scale=1;zoom()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){show(current+1);e.preventDefault()}if(e.key==='ArrowLeft'){show(current-1);e.preventDefault()}});show(0);</script></body></html>
